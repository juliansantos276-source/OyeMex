<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OyeLoMex — Escucha a México</title>
<meta name="description" content="OyeLoMex: una biblioteca cultural en audio. Historias, ideas y voces que ayudaron a formar México, en dominio público y en español mexicano.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f4a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OyeLoMex">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{
  --paper:#f6efe3;--papel:#fdf8ee;--ink:#222a20;--verde:#1f4a2e;--verde-osc:#16371f;
  --teja:#b24a1f;--oro:#c9a227;--linea:#e0d3bb;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* NAV */
nav{position:sticky;top:0;z-index:50;background:rgba(251,248,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.nav-inner{max-width:1120px;margin:0 auto;padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-size:24px;font-weight:600;text-decoration:none;color:var(--verde)}
.brand b{color:var(--teja)}
.nav-links{display:flex;gap:24px;list-style:none}
.nav-links a{font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--ink);opacity:.85}
.nav-links a:hover{color:var(--verde);opacity:1}
.nav-links .pill{border:1px solid var(--verde);color:var(--verde);border-radius:999px;padding:7px 15px}
.nav-links .pill:hover{background:var(--verde);color:#fff}

/* CONTINUE BAR */
.continue{display:none;background:var(--verde);color:#f3ecd9;padding:12px 22px;font-size:14px}
.continue-in{max-width:1120px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.continue .who{font-weight:600}
.continue button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:#fff;padding:7px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.continue button:hover{background:#fff;color:var(--verde)}

/* HERO */
.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:70px 24px;border-bottom:1px solid var(--linea);
 background:radial-gradient(900px 460px at 50% -8%,rgba(255,253,244,1),rgba(246,239,227,.4) 62%),linear-gradient(180deg,#f3e7d2,#eeddc0)}
.hero-kicker{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--teja);margin-bottom:22px;font-weight:600}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,8vw,92px);line-height:.98;color:var(--verde)}
.hero h1 em{font-style:italic;color:var(--teja)}
.hero .sub{max-width:56ch;margin:24px auto 0;font-size:19px;color:#4c543f}
.hero .actions{margin-top:38px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:14px 30px;border-radius:999px;text-decoration:none;font-size:15px;letter-spacing:.03em;border:1px solid var(--verde);cursor:pointer;transition:.18s;background:none;color:var(--verde)}
.btn--v{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn--v:hover{background:var(--verde-osc)}
.btn--t{color:var(--teja);border-color:var(--teja)}
.btn--t:hover{background:var(--teja);color:#fff}

/* LAYOUT + TYPE */
section{padding:64px 0}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.eyebrow{display:block;text-align:center;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--teja);margin-bottom:14px;font-weight:600}
.big-title{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.4vw,46px);text-align:center;color:var(--verde);margin-bottom:14px;line-height:1.05}
.lede{max-width:62ch;margin:0 auto 42px;font-size:18px;color:#4f5747;text-align:center}
.statement{background:var(--verde);color:#f3efdd;text-align:center;padding:66px 24px}
.statement p{font-family:var(--serif);font-size:clamp(24px,3.6vw,38px);line-height:1.3;font-style:italic;max-width:30ch;margin:0 auto}

/* CATEGORY GRID */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cat{background:var(--papel);border:1px solid var(--linea);border-top:4px solid var(--teja);border-radius:14px;padding:22px 20px;text-decoration:none;color:var(--ink);transition:.18s}
.cat:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(31,74,46,.12)}
.cat .en{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--teja);font-weight:600}
.cat h3{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--verde);margin:6px 0 8px}
.cat p{font-size:14px;color:#5a5f4e}

/* WORKS */
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.chip{border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.active{background:var(--verde);color:#fff;border-color:var(--verde)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:var(--papel);border:1px solid var(--linea);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(31,74,46,.12)}
.card .thumb{background:linear-gradient(135deg,var(--verde),var(--teja));color:#fff;height:84px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px}
.card .body{padding:18px 20px 20px}
.card .tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--teja);font-weight:600}
.card h3{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--verde);margin:5px 0 6px;line-height:1.1}
.card .sub{font-size:13.5px;color:#5a614f}
.card .dur{margin-top:10px;font-size:12.5px;color:#7d8170}

/* DETAIL */
.detail{max-width:820px;margin:0 auto;padding:0 22px 20px}
.back{display:inline-block;margin:30px 22px 0;font-size:14px;color:var(--teja);text-decoration:none;letter-spacing:.05em}
.back:hover{text-decoration:underline}
.dh1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,5vw,52px);color:var(--verde);line-height:1.03}
.dsub{font-size:17px;color:#4f5747;margin-top:6px}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.meta-pill{border:1px solid var(--linea);border-radius:999px;padding:5px 14px;font-size:12.5px;background:var(--papel)}
.meta-pill b{color:var(--verde);font-weight:600}
.bodycopy{font-size:17.5px;color:#3f453a;margin-top:18px}
.porque{background:var(--papel);border-left:4px solid var(--teja);border-radius:0 12px 12px 0;padding:18px 22px;margin-top:26px}
.porque h4{font-family:var(--serif);font-size:18px;color:var(--teja);margin-bottom:6px}
.porque p{font-size:15.5px;color:#4a4f40}
.sec-label{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--teja);font-weight:600;margin:30px 0 12px}
.ep{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.ep h4{font-family:var(--serif);font-size:19px;color:var(--verde);margin-bottom:10px}
.ep audio{width:100%;height:44px}
.empty{grid-column:1/-1;text-align:center;color:#7a8163;font-family:var(--serif);font-size:20px;padding:30px}

footer{border-top:1px solid var(--linea);padding:40px 24px;text-align:center;font-size:13px;color:#80856f}
footer .wm{font-family:var(--serif);font-size:22px;color:var(--verde);margin-bottom:6px}
@media(max-width:680px){.nav-links{display:none}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="#/">Oye<b>Lo</b>Mex</a>
    <ul class="nav-links">
      <li><a href="#/biblioteca">Biblioteca</a></li>
      <li><a href="#/camino">Un Camino</a></li>
      <li><a href="#/autor/altamirano">Altamirano</a></li>
      <li><a class="pill" href="#/obra/el-zarco">El Zarco</a></li>
    </ul>
  </div>
</nav>

<div class="continue" id="continueBar">
  <div class="continue-in">
    <span>▶ <span class="who" id="contWho"></span></span>
    <button onclick="continueLast()">Continuar escuchando</button>
  </div>
</div>

<main id="view"></main>

<footer>
  <div class="wm">OyeLoMex</div>
  <div>Historias, ideas y voces que ayudaron a formar México.</div>
  <div style="margin-top:10px">Dominio público · audio en español mexicano · comparte con respeto.</div>
</footer>

<script>
/* ========== CONTENIDO (esqueleto del master plan §17) ========== */
const CATS=[
 {id:"raices",n:"Raíces",en:"Indigenous heritage",d:"Culturas originarias, mitología, poesía y voces indígenas."},
 {id:"colonia",n:"Colonia",en:"New Spain",d:"Nueva España, religión, filosofía y la formación del México culto."},
 {id:"nacimiento",n:"Nacimiento",en:"Independence & nation",d:"La Independencia y el nacimiento de la nación."},
 {id:"revolucion",n:"Revolución",en:"The Revolution",d:"La Revolución y sus consecuencias sociales."},
 {id:"piensa",n:"México Piensa",en:"Philosophy & essays",d:"Filosofía, ensayo y crítica cultural."},
 {id:"siente",n:"México Siente",en:"Poetry & feeling",d:"Poesía y literatura del amor y del interior."},
 {id:"profundo",n:"México Profundo",en:"Rural & everyday",d:"El campo, las comunidades y la vida cotidiana."},
 {id:"mundo",n:"México en el Mundo",en:"Mexico abroad",d:"Migración, identidad y México frente al mundo."}
];
const AUTHORS=[
 {id:"altamirano",name:"Ignacio Manuel Altamirano",
  dato:"1834 · Tixtla, Guerrero — 1893 · San Remo, Italia",
  periodos:["Siglo XIX","Nacimiento","Reformas"],
  region:"Morelos / Guerrero",
  primero:"El zarco",
  bio:"Escritor, periodista y político de origen indígena, considerado uno de los fundadores de la novela mexicana. Educador e impulsor, encarnó el ideal de un México que empieza a narrarse a sí mismo: popular, rural y con orgullo.",
  porque:"Fue de los primeros en escribir un México rural sin caricatura: con dignidad, violencia y ternura a la vez. Escucharlo es entrar a la forja del México moderno."}
];
const WORKS=[
 {id:"el-zarco",title:"El Zarco",cat:"nacimiento",tags:["Nacimiento","México Profundo"],
  author:"altamirano",period:"escrita ca. 1884–86; publicada ~1904",region:"Yautepec, Morelos",
  genre:"Novela",dur:"Parte I ≈ 28 min · Parte II ≈ 28 min",
  source:"Texto: Biblioteca Digital ILCE (México). Obra de dominio público.",
  desc:"La historia de una época en llamas y de un amor que no puede: el México del liberalismo, sus dragones, sus haciendas de caña y sus visiones de honor.",
  porque:"Es una de las formas en que México comenzó a narrarse a sí mismo en el XIX — una ventana al país que quería formarse antes de la Revolución.",
  audio:[
   {file:"audio/elzarco_cap1.mp3",label:"El Zarago — Principio"},
   {file:"audio/elzarco_cap2.mp3",label:"El Zarago — Parte II"}
  ]}
];

/* ============ NÚCLEO ============ */
const view=document.getElementById("view");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catName=id=>{const c=CATS.find(x=>x.id===id);return c?c.n:""};
const authorOf=id=>AUTHORS.find(a=>a.id===id)||{};
const workOf=id=>Array.isArray(WORKS)?WORKS.find(w=>w.id===id)||null:WORKS[id]||null;

/* almacenamiento local (continuar donde quedó / mi biblioteca) */
const K_LAST="oyelomex:last", K_LIB="oyelomex:lib";
function saveLast(wid,idx,time){try{localStorage.setItem(K_LAST,JSON.stringify({wid,idx,time,at:Date.now()}))}catch(e){}}
function lastSave(){try{return JSON.parse(localStorage.getItem(K_LAST)||"null")}catch(e){return null}}
function lib(){try{return JSON.parse(localStorage.getItem(K_LIB)||"[]")}catch(e){return[]}}
function toggleLib(id){let l=lib();const i=l.indexOf(id);
  if(i<0)l.push(id);else l.splice(i,1);
  localStorage.setItem(K_LIB,JSON.stringify(l));return l.indexOf(id)>-1;}
function continueLast(){const l=lastSave();if(l&&l.wid)location.hash="#/obra/"+l.wid;}

function paintContinue(){
  const l=lastSave(),bar=document.getElementById("continueBar");
  if(!l){bar.style.display="none";return}
  const w=WORKS[l.wid];
  let who="tu última escucha";
  if(w){who=w.title;if(w.audio&&w.audio[l.idx])who+=" — "+w.audio[l.idx].label;}
  document.getElementById("contWho").textContent=who;bar.style.display="block";
}

function cardHtml(w){
  const a=authorOf(w.author);
  return `<a class="card" href="#/obra/${w.id}">
    <div class="thumb">${esc(w.title.charAt(0))}</div>
    <div class="body"><span class="tag">${esc(catName(w.cat))}</span>
      <h3>${esc(w.title)}</h3><div class="sub">${esc(a.name||"Autor")}</div>
      <div class="dur">${esc(w.dur||"")}</div></div></a>`;
}

/* ---------- rutas ---------- */
function router(){
  const hash=location.hash||"#/";
  const [path,qs]=hash.replace(/^#\//,"").split("?");
  const seg=path.split("/")[0];
  const p=path.split("/");
  const q=new URLSearchParams(qs||"");
  if(seg==="biblioteca") view.innerHTML=pageBiblioteca(q.get("c")||"");
  else if(seg==="autor") view.innerHTML=pageAutor(decodeURIComponent(p[1]||""));
  else if(seg==="obra") view.innerHTML=pageObra(p[1]);
  else if(seg==="camino") view.innerHTML=pageCamino();
  else view.innerHTML=pageHome();
  paintContinue();bind();
}
function bind(){
  document.querySelectorAll("#filters .chip").forEach(ch=>{
    ch.onclick=()=>{const c=ch.dataset.c||"";view.innerHTML=pageBiblioteca(c);paintContinue();bind();};
  });
  document.querySelectorAll("audio[data-wid]").forEach(a=>{
    const wid=a.dataset.wid,idx=+a.dataset.idx;
    const l=lastSave();
    if(l&&l.wid===wid&&l.idx===idx&&l.time>0&&l.time>a.currentTime){
      a.addEventListener("loadedmetadata",()=>{try{a.currentTime=l.time}catch(e){}},{once:true});
    }
    a.addEventListener("timeupdate",()=>{if(a.currentTime>0)a&&a.duration>0&&saveLast(wid,idx,a.currentTime);});
  });
}

/* ---------- páginas ---------- */
function pageHome(){
  const cats=CATS.map(c=>`<a class="cat" href="#/biblioteca?c=${c.id}"><span class="en">${c.en}</span><h3>${c.n}</h3><p>${c.d}</p></a>`).join("");
  const w=Object.values(WORKS)[0];
  return `
  <section class="hero">
    <span class="hero-kicker">Biblioteca cultural · en voz mexicana</span>
    <h1>Escucha el <em>México</em><br>que se lee.</h1>
    <p class="sub">Historias, ideas y voces que ayudaron a formar México — en audio, en dominio público.</p>
    <div class="actions">
      <a class="btn btn--v" href="#/biblioteca">Explorar la biblioteca</a>
      <a class="btn btn--t" href="#/camino">Empezar un Camino</a>
    </div>
  </section>
  <section>
    <div class="wrap">
      <span class="eyebrow">Escucha ahora</span>
      <h2 class="big-title">Lo que está sonando</h2>
      ${w?`<div class="works">${cardHtml(w)}</div>`:""}
    </div>
  </section>
  <section style="padding-top:20px">
    <div class="wrap">
      <span class="eyebrow">Explorar</span>
      <h2 class="big-title">Autores · Épocas · Temas · Regiones · Caminos</h2>
      <div class="cats">${cats}</div>
    </div>
  </section>
  <section class="statement"><p>México tiene muchas voces. Algunas vienen de hace siglos. Otras apenas comienzan. <em>Aquí las escuchamos.</em></p></section>`;
}

function pageBiblioteca(sel){
  const chips=['<button class="chip '+(sel?"":"active")+'" data-c="">Todos</button>']
    .concat(CATS.map(c=>`<button class="chip ${sel===c.id?"active":""}" data-c="${c.id}">${sel===c.id?"✓ ":""}${c.n}</button>`));
  const list=sel?Object.values(WORKS).filter(w=>w.cat===sel||(w.tags||[]).some(t=>t.toLowerCase()===sel.toLowerCase())):Object.values(WORKS);
  const grid=list.length?list.map(cardHtml).join(""):`<div class="empty">En esta categoría las estantes se llenan pronto — regresa en unos días.</div>`;
  return `
  <section><div class="wrap">
   <span class="eyebrow">La biblioteca</span>
   <h2 class="big-title">Biblioteca</h2>
   <p class="lede">Obras de dominio público elegidas con curadoría — un catálogo pequeño y bien curado, no un volcado infinito.</p>
   <div class="filters" id="filters">${chips.join("")}</div>
   <div class="works">${grid}</div>
  </div></section>`;
}

function pageAutor(id){
  const a=AUTHORS.find(x=>x.id===id);
  if(!a)return `<a class="back" href="#/biblioteca">← Volver</a><div class="detail"><p class="bodycopy">Autor no encontrado.</p></div>`;
  const works=Object.values(WORKS).filter(w=>w.author===id);
  return `
  <a class="back" href="#/biblioteca">← Volver a la biblioteca</a>
  <section class="detail">
   <span class="eyebrow" style="text-align:left">Autor</span>
   <h1 class="dh1">${esc(a.name)}</h1>
   <p class="dsub">${esc(a.dato)}</p>
   <div class="meta-row"><span class="meta-pill">Región: <b>${esc(a.region)}</b></span>
     ${(a.periodos||[]).map(p=>`<span class="meta-pill">${esc(p)}</span>`).join("")}</div>
   <p class="bodycopy">${esc(a.bio)}</p>
   <div class="porque"><h4>¿Por qué conocerlo?</h4><p>${esc(a.porque)}</p></div>
   <div class="sec-label">Obras en audio</div>
   ${works.length?works.map(cardHtml).join(""):`<p class="bodycopy">Aún sin audio publicado.</p>`}
  </section>`;
}

function pageObra(id){
  const w=workOf(id);
  if(!w)return `<a class="back" href="#/biblioteca">← Volver</a><div class="detail"><p class="bodycopy">No encontrada.</p></div>`;
  const a=authorOf(w.author);
  const eps=(w.audio||[]).map((t,i)=>`
    <div class="ep"><h4>${esc(t.label)}</h4>
      <audio controls preload="none" src="${t.file}" data-wid="${w.id}" data-idx="${i}"></audio></div>`).join("");
  return `
  <a class="back" href="#/biblioteca">← Volver a la biblioteca</a>
  <section class="detail">
   <span class="eyebrow" style="text-align:left">${esc(catName(w.cat))}</span>
   <h1 class="dh1">${esc(w.title)}</h1>
   <p class="dsub">${esc(a.name||"Autor")}</p>
   <div class="meta-row">
     <span class="meta-pill">Periodo: <b>${esc(w.period)}</b></span>
     <span class="meta-pill">Región: <b>${esc(w.region)}</b></span>
     <span class="meta-pill">Género: <b>${esc(w.genre)}</b></span>
   </div>
   <p class="bodycopy">${esc(w.desc)}</p>
   <div class="sec-label">Escuchar</div>
   ${eps}
   <div class="sec-label">¿Por qué escuchar esto?</div>
   <div class="porque"><p>${esc(w.porque)}</p></div>
   <p style="font-size:13.5px;color:#7a8163;margin-top:20px">${esc(w.dur)} · ${esc(w.source)}</p>
  </section>`;
}

function pageCamino(){
  return `
  <section class="detail">
   <span class="eyebrow" style="text-align:left">Caminos</span>
   <h1 class="dh1">Un Camino</h1>
   <p class="bodycopy">Secuencias curadas para escuchar con rumbo.<br>
   <strong>Camino: Conoce México</strong> · <strong>Camino: Aprende a Pensar México</strong> · <strong>Camino: México para Jóvenes</strong> · <strong>Camino: México y Estados Unidos</strong></p>
   <p class="bodycopy" style="color:#7a8163">Se iluminan cuando la biblioteca crezca. Mientras tanto, empieza por el origen: <a href="#/obra/el-zarco" style="color:var(--teja)">El Zarco</a>.</p>
  </section>`;
}

window.addEventListener("hashchange",()=>router());
router();
</script>
</body>
</html>
