<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OyeLoMex — Escucha a México</title>
<meta name="description" content="OyeLoMex: una biblioteca cultural en audio. Las voces, historias e ideas de dominio público que moldearon el pensamiento y la dignidad de México.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#B94726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OyeLoMex">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg-cream:#F8F5EE; --bg-surface:#FFFFFF; --bg-card:#F1ECE1;
 --text-main:#1C1917; --text-muted:#57534E; --text-faint:#A8A29E;
 --c-terracotta:#B94726; --c-terracotta-hover:#9A381C;
 --c-clay:#78350F; --c-basalt:#292524; --border-color:#E7E0D3;
 --serif:'Literata',Georgia,serif; --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--sans);line-height:1.6;padding-bottom:96px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.serif{font-family:var(--serif)}
.muted{color:var(--text-muted)}
.pill{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--border-color);color:var(--c-clay);display:inline-block}
.container{max-width:1140px;margin:0 auto;padding:0 20px}

/* NAV */
header{border-bottom:1px solid var(--border-color);background:var(--bg-cream);position:sticky;top:0;z-index:40}
.nav-wrapper{display:flex;justify-content:space-between;align-items:center;height:70px}
.brand{cursor:pointer;display:flex;flex-direction:column}
.brand-logo{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;color:var(--c-terracotta)}
.brand-tag{font-size:.7rem;font-weight:500;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase}
.nav-links{display:flex;gap:24px;align-items:center;list-style:none}
.nav-link{color:var(--text-main);text-decoration:none;font-size:.95rem;font-weight:500;cursor:pointer;transition:color .2s}
.nav-link:hover,.nav-link.active{color:var(--c-terracotta)}

/* Hero */
.hero{padding:64px 0 48px;border-bottom:1px solid var(--border-color)}
.hero-title{font-size:clamp(2.1rem,4vw,3.3rem);font-weight:600;line-height:1.15;margin-bottom:16px;max-width:820px}
.hero-title em{color:var(--c-terracotta)}
.hero-subtitle{font-size:1.15rem;color:var(--text-muted);max-width:680px;margin-bottom:28px;font-family:var(--serif);font-style:italic}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}

/* Buttons */
.btn{padding:13px 24px;border-radius:4px;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;transition:all .18s}
.btn-primary{background:var(--c-terracotta);color:#fff}
.btn-primary:hover{background:var(--c-terracotta-hover)}
.btn-outline{border-color:var(--c-basalt);color:var(--c-basalt);background:transparent}
.btn-outline:hover{background:var(--c-basalt);color:#fff}

/* Filter bar */
.filter-bar{margin:32px 0 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-input{flex:1 1 280px;padding:11px 14px;border:1px solid var(--border-color);border-radius:4px;font-family:var(--sans);font-size:.95rem;background:var(--bg-surface);color:var(--text-main)}
.search-input:focus{outline:none;border-color:var(--c-terracotta)}
#categoryPills{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{background:transparent;border:1px solid var(--border-color);padding:8px 14px;border-radius:4px;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--text-muted)}
.filter-btn:hover{border-color:var(--c-terracotta);color:var(--c-terracotta)}
.filter-btn.active{background:var(--c-basalt);color:#fff;border-color:var(--c-basalt)}

/* Grid + Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;margin-bottom:48px}
.card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:6px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.05)}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:1.25rem;line-height:1.3;margin-bottom:6px}
.card-author{font-size:.9rem;color:var(--c-terracotta);font-weight:500;margin-bottom:12px}
.card-desc{font-size:.88rem;color:var(--text-muted);line-height:1.45;margin-bottom:16px;flex-grow:1}
.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-color);padding-top:12px;font-size:.8rem;color:var(--text-muted)}

/* Detail modal */
.detail-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(28,25,23,.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.detail-box{background:var(--bg-cream);border-radius:8px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;padding:32px;box-shadow:0 20px 40px rgba(0,0,0,.2);border:1px solid var(--border-color)}
.detail-close{float:right;font-size:1.6rem;cursor:pointer;border:none;background:transparent;line-height:1}
.detail-quote{border-left:3px solid var(--c-terracotta);padding-left:14px;margin:20px 0;font-family:var(--serif);font-style:italic;color:var(--c-clay);font-size:1.05rem}

/* Persistent audio bar */
.audio-player-bar{position:fixed;bottom:0;left:0;width:100%;background:var(--c-basalt);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:50;box-shadow:0 -4px 15px rgba(0,0,0,.15);flex-wrap:wrap;gap:12px}
.player-track{display:flex;flex-direction:column;min-width:0;max-width:280px}
.player-title{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-author{font-size:.8rem;color:var(--text-faint)}
.player-controls{display:flex;align-items:center;gap:16px}
.btn-play-ctrl{background:var(--c-terracotta);border:none;width:44px;height:44px;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.player-scrub{flex:1;margin:0 20px;max-width:400px;display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--text-faint)}
.player-scrub input[type=range]{flex:1;accent-color:var(--c-terracotta)}
@media (max-width:768px){.player-scrub{display:none}.nav-links{display:none}}
</style>
</head>
<body>

<header>
 <div class="container nav-wrapper">
  <div class="brand" onclick="renderView('works')">
   <span class="brand-logo">OyeLoMex</span>
   <span class="brand-tag">Escucha a México</span>
  </div>
  <ul class="nav-links">
   <li><a class="nav-link active" onclick="switchTab(event,'works')">Biblioteca</a></li>
   <li><a class="nav-link" onclick="switchTab(event,'caminos')">Caminos</a></li>
   <li><a class="nav-link" onclick="switchTab(event,'autores')">Autores</a></li>
  </ul>
 </div>
</header>

<section class="hero">
 <div class="container">
  <h1 class="hero-title">No queremos decirte qué pensar.<br>Queremos darte algo <em>digno de pensar</em>.</h1>
  <p class="hero-subtitle">Las voces, historias e ideas que moldearon el pensamiento y la dignidad de México, ahora en audio.</p>
  <div class="hero-actions">
   <button class="btn btn-primary" onclick="playWork(libraryData[0].id)">Escuchar Selección Destacada</button>
   <button class="btn btn-outline" onclick="switchTab(null,'caminos')">Explorar Caminos Curados</button>
  </div>
 </div>
</section>

<main class="container" style="margin-top:24px">
 <div class="filter-bar" id="filterBar">
  <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título, autor, tema (Revolución, Raíces, Independencia)..." oninput="applyFilters()" />
  <div id="categoryPills">
   <button class="filter-btn active" onclick="setCategory('ALL')">Todos</button>
   <button class="filter-btn" onclick="setCategory('RAÍCES')">Raíces</button>
   <button class="filter-btn" onclick="setCategory('NACIMIENTO')">Nacimiento</button>
   <button class="filter-btn" onclick="setCategory('REVOLUCIÓN')">Revolución</button>
   <button class="filter-btn" onclick="setCategory('MÉXICO PIENSA')">México Piensa</button>
   <button class="filter-btn" onclick="setCategory('MÉXICO SIENTE')">México Siente</button>
  </div>
 </div>
 <div id="contentGrid" class="grid"></div>
</main>

<div class="audio-player-bar" id="audioBar">
 <div class="player-track">
  <span class="player-title" id="currentTrackTitle">Selecciona una obra</span>
  <span class="player-author" id="currentTrackAuthor">—</span>
 </div>
 <div class="player-controls">
  <button class="btn-play-ctrl" id="playBtn" onclick="togglePlay()">▶</button>
 </div>
 <div class="player-scrub">
  <span id="currentTime">0:00</span>
  <input type="range" id="progressBar" value="0" min="0" max="100" onchange="seekAudio(this.value)" />
  <span id="durationTime">0:00</span>
 </div>
</div>

<div class="detail-overlay" id="detailModal" onclick="closeModal(event)">
 <div class="detail-box" onclick="event.stopPropagation()">
  <button class="detail-close" onclick="closeModalDirect()">&times;</button>
  <div id="modalContent"></div>
 </div>
</div>

<script>
// —— Catálogo inicial: obras y audios de dominio público verificados ——
const libraryData = [
 { id:"el-zarco-parte-1", title:"El Zarco · Parte I", author:"Ignacio Manuel Altamirano", year:1900, period:"MÉXICO PROFUNDO", duration:"27m 38s",
   desc:"Novela de bandidos, pueblos y dilemas morales en el México del siglo XIX. Una entrada a la narrativa de Altamirano.",
   whyListen:"Altamirano combina aventura, paisaje y crítica social para retratar las tensiones de un país que buscaba reconstruirse.",
   excerpt:"En las montañas y en los pueblos, la violencia no era una leyenda: era una presencia cotidiana que ponía a prueba el carácter.",
   audioSrc:"audio/elzarco_cap1.mp3", source:"Biblioteca Digital ILCE · grabación OyeLoMex" },
 { id:"el-zarco-parte-2", title:"El Zarco · Parte II", author:"Ignacio Manuel Altamirano", year:1900, period:"MÉXICO PROFUNDO", duration:"27m 34s",
   desc:"Continúa la historia de Manuela, Nicolás y el Zarco entre la violencia, el deseo y las consecuencias de las decisiones.",
   whyListen:"La segunda parte deja ver cómo una comunidad intenta recuperar la dignidad después de que la violencia altera sus vínculos.",
   excerpt:"La historia no absuelve a nadie: muestra el precio de confundir la libertad con el poder de imponer miedo.",
   audioSrc:"audio/elzarco_cap2.mp3", source:"Biblioteca Digital ILCE · grabación OyeLoMex" },
 { id:"los-de-abajo", title:"Los de abajo", author:"Mariano Azuela", year:1915, period:"REVOLUCIÓN", duration:"Próximamente",
   desc:"El retrato crudo del campesinado durante el torbellino revolucionario. Sin falsos héroes ni propaganda.",
   whyListen:"Obra fundacional de la novela revolucionaria. Su ficha está lista; el audio se incorporará en una próxima edición.",
   excerpt:"Una novela para escuchar la duda, el dolor y la desilusión que también formaron la Revolución.", audioSrc:null },
 { id:"navidad-en-las-montanas", title:"Navidad en las montañas", author:"Ignacio Manuel Altamirano", year:1871, period:"NACIMIENTO", duration:"Próximamente",
   desc:"Un encuentro entre un militar liberal y un sacerdote en una comunidad rural de la sierra mexicana.",
   whyListen:"Altamirano imagina la educación, la comunidad y el respeto mutuo como caminos de reconciliación nacional.",
   excerpt:"Una obra sobre la posibilidad de construir paz después de décadas de conflicto.", audioSrc:null },
 { id:"la-suave-patria", title:"La Suave Patria", author:"Ramón López Velarde", year:1921, period:"MÉXICO SIENTE", duration:"Próximamente",
   desc:"El poema épico e íntimo que busca la patria en el barro, el pan y la vida cotidiana.",
   whyListen:"López Velarde despoja al nacionalismo de fanfarrias para encontrar una patria íntima, contradictoria y vulnerable.",
   excerpt:"Patria: tu superficie es el maíz, tus minas el palacio del Rey de Oros...", audioSrc:null }
];
const caminosData = [
 { title:"Camino: Entrar al México profundo", steps:"2 partes · 55 min de escucha",
   desc:"Empieza con una novela de Ignacio Manuel Altamirano: pueblos, paisaje, violencia y decisiones que siguen hablando al presente.",
   works:["El Zarco · Parte I","El Zarco · Parte II"] },
 { title:"Camino: Entender la Revolución", steps:"Obras en preparación",
   desc:"Una ruta para ir más allá del mito oficial: oír la duda, el dolor y la literatura nacida del fuego de 1910-1925.",
   works:["Los de abajo","La Suave Patria"] }
];

let currentCategory='ALL', activeTab='works';
let activeAudio=new Audio(), currentTrackId=null;

function renderWorks(data){
 const c=document.getElementById('contentGrid'); c.innerHTML='';
 if(!data.length){ c.innerHTML='<p class="muted" style="grid-column:1/-1;text-align:center;padding:40px 0">No se encuentran obras con ese criterio.</p>'; return; }
 data.forEach(it=>{
  const card=document.createElement('div'); card.className='card'; card.onclick=()=>openWorkModal(it.id);
  card.innerHTML=
   '<div>'+
    '<div class="card-meta"><span class="pill">'+it.period+'</span><span class="muted" style="font-size:.75rem">'+it.duration+'</span></div>'+
    '<h3 class="card-title">'+it.title+'</h3>'+
    '<p class="card-author">'+it.author+' ('+it.year+')</p>'+
    '<p class="card-desc">'+it.desc+'</p>'+
   '</div>'+
   '<div class="card-footer"><span>'+(it.audioSrc?'Escuchar obra':'Audio próximamente')+'</span>'+
    (it.audioSrc?'<button class="btn-play-ctrl" style="width:30px;height:30px;font-size:.8rem" onclick="event.stopPropagation();playWork(\''+it.id+'\')">▶</button>':'<span class="muted" style="font-size:.75rem">Ficha</span>')+'</div>';
  c.appendChild(card);
 });
}
function renderCaminos(){
 const c=document.getElementById('contentGrid'); c.innerHTML='';
 caminosData.forEach(c2=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=
   '<div>'+
    '<span class="pill" style="margin-bottom:12px">Curaduría OyeLoMex</span>'+
    '<h3 class="card-title" style="margin-top:12px">'+c2.title+'</h3>'+
    '<p class="muted" style="font-size:.85rem;margin:10px 0">'+c2.steps+'</p>'+
    '<p class="card-desc">'+c2.desc+'</p>'+
   '</div>'+
   '<div class="card-footer"><span style="font-weight:600;color:var(--c-terracotta)">Iniciar este Camino →</span></div>';
  c.appendChild(card);
 });
}
function renderAutores(){
 const c=document.getElementById('contentGrid');
 c.innerHTML='<p class="muted" style="grid-column:1/-1;text-align:center;padding:40px 0">Directorio biográfico de Ignacio Manuel Altamirano, Sor Juana, Mariano Azuala y Alfonso Reyes — en preparación.</p>';
}
function applyFilters(){
 if(activeTab!=='works') return;
 const q=document.getElementById('searchInput').value.toLowerCase();
 const f=libraryData.filter(it=>{
  const cat=currentCategory==='ALL'||it.period===currentCategory;
  const mq=it.title.toLowerCase().includes(q)||it.author.toLowerCase().includes(q)||(it.period||'').toLowerCase().includes(q)||(it.desc||'').toLowerCase().includes(q);
  return cat&&mq;
 });
 renderWorks(f);
}
function setCategory(cat){
 currentCategory=cat;
 document.querySelectorAll('#categoryPills .filter-btn').forEach(b=>{ b.classList.toggle('active',(b.innerText.toUpperCase()=== (cat==='ALL'?'TODOS':cat))); });
 applyFilters();
}
function switchTab(e,tab){
 activeTab=tab;
 document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
 document.querySelectorAll('.nav-link').forEach(l=>{ if(l.innerText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')===tab) l.classList.add('active'); });
 const clear=document.getElementById('filterBar');
 if(tab==='works'){clear.style.display='flex';applyFilters();}
 else if(tab==='caminos'){clear.style.display='none';renderCaminos();}
 else {clear.style.display='none';renderAutores();}
}
function openWorkModal(id){
 const it=libraryData.find(w=>w.id===id); if(!it) return;
 document.getElementById('modalContent').innerHTML=
  '<span class="pill">'+it.period+'</span>'+
  '<h2 style="margin:10px 0 4px;font-size:1.8rem">'+it.title+'</h2>'+
  '<p class="card-author" style="font-size:1.05rem">'+it.author+' — '+it.year+'</p>'+
  '<div class="detail-quote">"'+it.excerpt+'"</div>'+
  '<h4 style="font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-top:20px">¿Por qué escuchar esto?</h4>'+
  '<p style="margin-top:6px;font-size:.95rem">'+it.whyListen+'</p>'+
  '<div style="margin-top:24px;display:flex;gap:12px">'+
   (it.audioSrc?'<button class="btn btn-primary" onclick="playWork(\''+it.id+'\');closeModalDirect()">Reproducir ('+it.duration+')</button>':'<span class="pill" style="padding:10px">Audio próximamente</span>')+
   '<button class="btn btn-outline" onclick="closeModalDirect()">Regresar</button></div>';
 document.getElementById('detailModal').style.display='flex';
}
function closeModal(e){ if(e.target.id==='detailModal') closeModalDirect(); }
function closeModalDirect(){ document.getElementById('detailModal').style.display='none'; }

function playWork(id){
 const it=libraryData.find(w=>w.id===id); if(!it || !it.audioSrc) return;
 if(currentTrackId!==id){
  currentTrackId=id; activeAudio.src=it.audioSrc;
  localStorage.setItem('oyelomex-last-track',id);
  document.getElementById('currentTrackTitle').innerText=it.title+' · '+it.author;
  document.getElementById('currentTrackAuthor').innerText=it.author;
  activeAudio.play(); document.getElementById('playBtn').innerText='❚❚';
 } else { togglePlay(); }
}
function togglePlay(){
 if(!currentTrackId){ playWork(localStorage.getItem('oyelomex-last-track')||libraryData[0].id); return; }
 if(activeAudio.paused){ activeAudio.play(); document.getElementById('playBtn').innerText='❚❚'; }
 else { activeAudio.pause(); document.getElementById('playBtn').innerText='▶'; }
}
activeAudio.ontimeupdate=()=>{
 const p=document.getElementById('progressBar'), ct=document.getElementById('currentTime'), dt=document.getElementById('durationTime');
 if(activeAudio.duration){ p.value=(activeAudio.currentTime/activeAudio.duration)*100; ct.innerText=formatTime(activeAudio.currentTime); dt.innerText=formatTime(activeAudio.duration); }
};
function seekAudio(v){ if(activeAudio.duration) activeAudio.currentTime=(v/100)*activeAudio.duration; }
function formatTime(s){ s=Math.floor(s||0); const m=Math.floor(s/60); return m+':'+(s%60<10?'0':'')+(s%60); }

// Registro de service worker (PWA)
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{})); }

// Recupera la última obra escuchada (la posición se guarda al salir).
const savedTrack=localStorage.getItem('oyelomex-last-track');
const savedTime=parseFloat(localStorage.getItem('oyelomex-time-'+savedTrack));
if(savedTrack && libraryData.some(w=>w.id===savedTrack && w.audioSrc)){
 const saved=libraryData.find(w=>w.id===savedTrack); currentTrackId=savedTrack; activeAudio.src=saved.audioSrc;
 document.getElementById('currentTrackTitle').innerText=saved.title+' · '+saved.author;
 document.getElementById('currentTrackAuthor').innerText=saved.author;
 activeAudio.addEventListener('loadedmetadata',()=>{if(savedTime) activeAudio.currentTime=savedTime;},{once:true});
}
activeAudio.addEventListener('timeupdate',()=>{if(currentTrackId) localStorage.setItem('oyelomex-time-'+currentTrackId,activeAudio.currentTime);});
applyFilters();
</script>
</body>
</html>
