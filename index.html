<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OyeLoMex — Escucha a México</title>
<meta name="description" content="OyeLoMex: una biblioteca cultural en audio. Historias, ideas y voces que ayudaron a formar México, en dominio público y en español mexicano.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f4a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OyeLoMex">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-cream:#F8F5EE;
  --bg-surface:#FFFFFF;
  --bg-card:#F1ECE1;
  --text-main:#1C1917;
  --text-muted:#57534E;
  --text-faint:#A8A29E;
  --c-terracotta:#B94726;
  --c-terracotta-hover:#9A381C;
  --c-clay:#78350F;
  --c-basalt:#292524;
  --border-color:#E7E0D3;
  --serif:'Literata',Georgia,serif;
  --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg-cream);color:var(--text);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* NAV — clean editorial */
header,nav{background:var(--bg-cream);border-bottom:1px solid var(--border-color)}
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.nav-inner{max-width:1140px;margin:0 auto;padding:0 20px;height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;text-decoration:none;cursor:pointer;line-height:1.05}
.brand strong{font-family:var(--sans);font-size:1.42rem;font-weight:700;letter-spacing:-.02em;color:var(--c-terracotta)}
.brand small{font-size:.68rem;font-weight:500;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}
.nav-links{display:flex;gap:24px;align-items:center;list-style:none}
.nav-links a{color:var(--text);text-decoration:none;font-size:.9rem;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--c-terracotta)}
.nav-links .pill{border:1px solid var(--c-terracotta);color:var(--c-terracotta);border-radius:4px;padding:8px 16px;font-weight:600}
.nav-links .pill:hover{background:var(--c-terracotta);color:#fff}

/* CONTINUE BAR */
.continue{display:none;background:var(--c-basalt);color:#efe7d8;padding:12px 20px;font-size:14px}
.continue-in{max-width:1140px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.continue .who{font-weight:600}
.continue button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;padding:7px 16px;border-radius:4px;cursor:pointer;font-size:13px}
.continue button:hover{background:#fff;color:var(--c-basalt)}

/* HERO */
.hero{padding:78px 20px 56px;border-bottom:1px solid var(--border-color);background:var(--bg-cream)}
.hero-inner{max-width:1140px;margin:0 auto}
.hero-kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--c-clay);background:var(--border-color);display:inline-block;padding:4px 10px;border-radius:4px;margin-bottom:22px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.3rem,4.2vw,3.5rem);line-height:1.14;margin-bottom:16px;max-width:760px;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--c-terracotta)}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:1.22rem;color:var(--text-muted);max-width:640px;margin-bottom:28px}
.hero .actions{display:flex;gap:14px;flex-wrap:wrap}
.btn{padding:13px 24px;border-radius:4px;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;transition:all .18s}
.btn--v{background:var(--c-terracotta);color:#fff}
.btn--v:hover{background:var(--c-terracotta-hover)}
.btn--t{background:transparent;color:var(--c-clay);border-color:var(--c-clay)}
.btn--t:hover{background:var(--c-clay);color:#fff}

/* LAYOUT + TYPE */
section{padding:60px 0}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.eyebrow{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--c-terracotta);margin-bottom:12px}
.big-title{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,3.4vw,2.8rem);color:var(--text);margin-bottom:12px;line-height:1.08;letter-spacing:-.01em}
.lede{max-width:60ch;margin:0 0 38px;font-size:1.08rem;color:var(--text-muted);font-family:var(--serif)}
.center{text-align:center;margin-left:auto;margin-right:auto}
.center .eyebrow{text-align:center}

/* STATEMENT */
.statement{background:var(--c-basalt);color:#efe7d8;text-align:center;padding:70px 24px;border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color)}
.statement p{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.3;max-width:30ch;margin:0 auto;color:#f4eee0}
.statement em{color:var(--c-terracotta)}

/* CATEGORY GRID */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.cat{background:var(--bg-surface);border:1px solid var(--border-color);border-top:3px solid var(--c-terracotta);border-radius:6px;padding:22px 20px;text-decoration:none;color:var(--text);transition:.18s}
.cat:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(28,25,23,.08)}
.cat .en{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c-clay)}
.cat h3{font-family:var(--serif);font-size:1.42rem;font-weight:600;color:var(--text);margin:7px 0 8px;line-height:1.05}
.cat p{font-size:.86rem;color:var(--text-muted)}

/* WORKS + CARDS */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.chip{border:1px solid var(--border-color);background:var(--bg-surface);border-radius:999px;padding:8px 16px;font-size:.82rem;cursor:pointer;color:var(--text-muted);font-weight:500}
.chip:hover{border-color:var(--c-terracotta);color:var(--c-terracotta)}
.chip.active{background:var(--c-basalt);color:#fff;border-color:var(--c-basalt)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:20px}
.card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(28,25,23,.09)}
.card .thumb{background:linear-gradient(135deg,var(--c-clay),var(--c-terracotta));color:#fff;height:86px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:2rem;font-weight:600}
.card .body{padding:18px 20px 20px}
.card .tag{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c-terracotta)}
.card h3{font-family:var(--serif);font-size:1.4rem;font-weight:600;color:var(--text);margin:6px 0 6px;line-height:1.08}
.card .sub{font-size:.86rem;color:var(--text-muted)}
.card .dur{margin-top:10px;font-size:.74rem;color:var(--text-faint)}

/* DETAIL */
.detail{max-width:820px;margin:0 auto;padding:0 20px 20px}
.back{display:inline-block;margin:32px 20px 0;font-size:.9rem;color:var(--c-terracotta);text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.dh1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,2.9rem);color:var(--text);line-height:1.05;letter-spacing:-.01em}
.dsub{font-family:var(--serif);font-size:1.12rem;color:var(--text-muted);margin-top:8px;font-style:italic}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.meta-pill{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:4px 10px;border-radius:4px;background:var(--border-color);color:var(--c-clay)}
.bodycopy{font-size:1.06rem;color:#34302b;margin-top:18px;font-family:var(--serif)}
.porque{background:var(--bg-card);border-left:4px solid var(--c-terracotta);border-radius:0 8px 8px 0;padding:18px 22px;margin-top:26px}
.porque h4{font-family:var(--serif);font-size:1.05rem;color:var(--c-terracotta);margin-bottom:6px;font-weight:600}
.porque p{font-size:.96rem;color:var(--text-muted)}
.sec-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c-terracotta);margin:30px 0 12px}
.ep{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.ep h4{font-family:var(--serif);font-size:1.12rem;color:var(--text);margin-bottom:10px;font-weight:600}
.ep audio{width:100%;height:46px}
.empty{grid-column:1/-1;color:var(--text-faint);font-family:var(--serif);font-size:1.15rem;padding:30px}

footer{background:var(--c-basalt);color:#d6cfb8;padding:44px 24px;text-align:center;font-size:.82rem}
footer .wm{font-family:var(--serif);font-size:1.6rem;color:var(--bg-cream);margin-bottom:8px}
@media(max-width:680px){.nav-links{display:none}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="#/">Oye<b>Lo</b>Mex</a>
    <ul class="nav-links">
      <li><a href="#/biblioteca">Biblioteca</a></li>
      <li><a href="#/camino">Un Camino</a></li>
      <li><a href="#/autor/altamirano">Altamirano</a></li>
      <li><a class="pill" href="#/obra/el-zarco">El Zarco</a></li>
    </ul>
  </div>
</nav>
<div class="mural"></div>

<div class="continue" id="continueBar">
  <div class="continue-in">
    <span>▶ <span class="who" id="contWho"></span></span>
    <button onclick="continueLast()">Continuar escuchando</button>
  </div>
</div>

<main id="view"></main>

<footer>
  <div class="wm">OyeLoMex</div>
  <div>Historias, ideas y voces que ayudaron a formar México.</div>
  <div style="margin-top:10px">Dominio público · audio en español mexicano · comparte con respeto.</div>
</footer>

<script>
/* ========== CONTENIDO (esqueleto del master plan §17) ========== */
const CATS=[
 {id:"raices",n:"Raíces",en:"Indigenous heritage",d:"Culturas originarias, mitología, poesía y voces indígenas."},
 {id:"colonia",n:"Colonia",en:"New Spain",d:"Nueva España, religión, filosofía y la formación del México culto."},
 {id:"nacimiento",n:"Nacimiento",en:"Independence & nation",d:"La Independencia y el nacimiento de la nación."},
 {id:"revolucion",n:"Revolución",en:"The Revolution",d:"La Revolución y sus consecuencias sociales."},
 {id:"piensa",n:"México Piensa",en:"Philosophy & essays",d:"Filosofía, ensayo y crítica cultural."},
 {id:"siente",n:"México Siente",en:"Poetry & feeling",d:"Poesía y literatura del amor y del interior."},
 {id:"profundo",n:"México Profundo",en:"Rural & everyday",d:"El campo, las comunidades y la vida cotidiana."},
 {id:"mundo",n:"México en el Mundo",en:"Mexico abroad",d:"Migración, identidad y México frente al mundo."}
];
const AUTHORS=[
 {id:"altamirano",name:"Ignacio Manuel Altamirano",
  dato:"1834 · Tixtla, Guerrero — 1893 · San Remo, Italia",
  periodos:["Siglo XIX","Nacimiento","Reformas"],
  region:"Morelos / Guerrero",
  primero:"El zarco",
  bio:"Escritor, periodista y político de origen indígena, considerado uno de los fundadores de la novela mexicana. Educador e impulsor, encarnó el ideal de un México que empieza a narrarse a sí mismo: popular, rural y con orgullo.",
  porque:"Fue de los primeros en escribir un México rural sin caricatura: con dignidad, violencia y ternura a la vez. Escucharlo es entrar a la forja del México moderno."}
];
const WORKS=[
 {id:"el-zarco",title:"El Zarco",cat:"nacimiento",tags:["Nacimiento","México Profundo"],
  author:"altamirano",period:"escrita ca. 1884–86; publicada ~1904",region:"Yautepec, Morelos",
  genre:"Novela",dur:"Parte I ≈ 28 min · Parte II ≈ 28 min",
  source:"Texto: Biblioteca Digital ILCE (México). Obra de dominio público.",
  desc:"La historia de una época en llamas y de un amor que no puede: el México del liberalismo, sus dragones, sus haciendas de caña y sus visiones de honor.",
  porque:"Es una de las formas en que México comenzó a narrarse a sí mismo en el XIX — una ventana al país que quería formarse antes de la Revolución.",
  audio:[
   {file:"audio/elzarco_cap1.mp3",label:"El Zarago — Principio"},
   {file:"audio/elzarco_cap2.mp3",label:"El Zarago — Parte II"}
  ]}
];

/* ============ NÚCLEO ============ */
const view=document.getElementById("view");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catName=id=>{const c=CATS.find(x=>x.id===id);return c?c.n:""};
const authorOf=id=>AUTHORS.find(a=>a.id===id)||{};
const workOf=id=>Array.isArray(WORKS)?WORKS.find(w=>w.id===id)||null:WORKS[id]||null;

/* almacenamiento local (continuar donde quedó / mi biblioteca) */
const K_LAST="oyelomex:last", K_LIB="oyelomex:lib";
function saveLast(wid,idx,time){try{localStorage.setItem(K_LAST,JSON.stringify({wid,idx,time,at:Date.now()}))}catch(e){}}
function lastSave(){try{return JSON.parse(localStorage.getItem(K_LAST)||"null")}catch(e){return null}}
function lib(){try{return JSON.parse(localStorage.getItem(K_LIB)||"[]")}catch(e){return[]}}
function toggleLib(id){let l=lib();const i=l.indexOf(id);
  if(i<0)l.push(id);else l.splice(i,1);
  localStorage.setItem(K_LIB,JSON.stringify(l));return l.indexOf(id)>-1;}
function continueLast(){const l=lastSave();if(l&&l.wid)location.hash="#/obra/"+l.wid;}

function paintContinue(){
  const l=lastSave(),bar=document.getElementById("continueBar");
  if(!l){bar.style.display="none";return}
  const w=WORKS[l.wid];
  let who="tu última escucha";
  if(w){who=w.title;if(w.audio&&w.audio[l.idx])who+=" — "+w.audio[l.idx].label;}
  document.getElementById("contWho").textContent=who;bar.style.display="block";
}

function cardHtml(w){
  const a=authorOf(w.author);
  return `<a class="card" href="#/obra/${w.id}">
    <div class="thumb">${esc(w.title.charAt(0))}</div>
    <div class="body"><span class="tag">${esc(catName(w.cat))}</span>
      <h3>${esc(w.title)}</h3><div class="sub">${esc(a.name||"Autor")}</div>
      <div class="dur">${esc(w.dur||"")}</div></div></a>`;
}

/* ---------- rutas ---------- */
function router(){
  const hash=location.hash||"#/";
  const [path,qs]=hash.replace(/^#\//,"").split("?");
  const seg=path.split("/")[0];
  const p=path.split("/");
  const q=new URLSearchParams(qs||"");
  if(seg==="biblioteca") view.innerHTML=pageBiblioteca(q.get("c")||"");
  else if(seg==="autor") view.innerHTML=pageAutor(decodeURIComponent(p[1]||""));
  else if(seg==="obra") view.innerHTML=pageObra(p[1]);
  else if(seg==="camino") view.innerHTML=pageCamino();
  else view.innerHTML=pageHome();
  paintContinue();bind();
}
function bind(){
  document.querySelectorAll("#filters .chip").forEach(ch=>{
    ch.onclick=()=>{const c=ch.dataset.c||"";view.innerHTML=pageBiblioteca(c);paintContinue();bind();};
  });
  document.querySelectorAll("audio[data-wid]").forEach(a=>{
    const wid=a.dataset.wid,idx=+a.dataset.idx;
    const l=lastSave();
    if(l&&l.wid===wid&&l.idx===idx&&l.time>0&&l.time>a.currentTime){
      a.addEventListener("loadedmetadata",()=>{try{a.currentTime=l.time}catch(e){}},{once:true});
    }
    a.addEventListener("timeupdate",()=>{if(a.currentTime>0)a&&a.duration>0&&saveLast(wid,idx,a.currentTime);});
  });
}

/* ---------- páginas ---------- */
function pageHome(){
  const cats=CATS.map(c=>`<a class="cat" href="#/biblioteca?c=${c.id}"><span class="en">${c.en}</span><h3>${c.n}</h3><p>${c.d}</p></a>`).join("");
  const w=Object.values(WORKS)[0];
  return `
  <section class="hero">
    <div class="hero-inner">
      <span class="hero-kicker">Biblioteca cultural · en voz mexicana</span>
      <h1>Escucha el <em>México</em><br>que se lee.</h1>
      <p class="sub">Historias, ideas y voces que ayudaron a formar México — en audio, en dominio público.</p>
      <div class="actions">
        <a class="btn btn--v" href="#/biblioteca">Explorar la biblioteca</a>
        <a class="btn btn--t" href="#/camino">Empezar un Camino</a>
      </div>
    </div>
  </section>
  <section>
    <div class="wrap">
      <span class="eyebrow">Escucha ahora</span>
      <h2 class="big-title">Lo que está sonando</h2>
      ${w?`<div class="works">${cardHtml(w)}</div>`:""}
    </div>
  </section>
  <section style="padding-top:20px">
    <div class="wrap">
      <span class="eyebrow">Explorar</span>
      <h2 class="big-title">Autores · Épocas · Temas · Regiones · Caminos</h2>
      <div class="cats">${cats}</div>
    </div>
  </section>
  <section class="statement"><p>México tiene muchas voces. Algunas vienen de hace siglos. Otras apenas comienzan. <em>Aquí las escuchamos.</em></p></section>`;
}

function pageBiblioteca(sel){
  const chips=['<button class="chip '+(sel?"":"active")+'" data-c="">Todos</button>']
    .concat(CATS.map(c=>`<button class="chip ${sel===c.id?"active":""}" data-c="${c.id}">${sel===c.id?"✓ ":""}${c.n}</button>`));
  const list=sel?Object.values(WORKS).filter(w=>w.cat===sel||(w.tags||[]).some(t=>t.toLowerCase()===sel.toLowerCase())):Object.values(WORKS);
  const grid=list.length?list.map(cardHtml).join(""):`<div class="empty">En esta categoría las estantes se llenan pronto — regresa en unos días.</div>`;
  return `
  <section><div class="wrap">
   <span class="eyebrow">La biblioteca</span>
   <h2 class="big-title">Biblioteca</h2>
   <p class="lede">Obras de dominio público elegidas con curadoría — un catálogo pequeño y bien curado, no un volcado infinito.</p>
   <div class="filters" id="filters">${chips.join("")}</div>
   <div class="works">${grid}</div>
  </div></section>`;
}

function pageAutor(id){
  const a=AUTHORS.find(x=>x.id===id);
  if(!a)return `<a class="back" href="#/biblioteca">← Volver</a><div class="detail"><p class="bodycopy">Autor no encontrado.</p></div>`;
  const works=Object.values(WORKS).filter(w=>w.author===id);
  return `
  <a class="back" href="#/biblioteca">← Volver a la biblioteca</a>
  <section class="detail">
   <span class="eyebrow" style="text-align:left">Autor</span>
   <h1 class="dh1">${esc(a.name)}</h1>
   <p class="dsub">${esc(a.dato)}</p>
   <div class="meta-row"><span class="meta-pill">Región: <b>${esc(a.region)}</b></span>
     ${(a.periodos||[]).map(p=>`<span class="meta-pill">${esc(p)}</span>`).join("")}</div>
   <p class="bodycopy">${esc(a.bio)}</p>
   <div class="porque"><h4>¿Por qué conocerlo?</h4><p>${esc(a.porque)}</p></div>
   <div class="sec-label">Obras en audio</div>
   ${works.length?works.map(cardHtml).join(""):`<p class="bodycopy">Aún sin audio publicado.</p>`}
  </section>`;
}

function pageObra(id){
  const w=workOf(id);
  if(!w)return `<a class="back" href="#/biblioteca">← Volver</a><div class="detail"><p class="bodycopy">No encontrada.</p></div>`;
  const a=authorOf(w.author);
  const eps=(w.audio||[]).map((t,i)=>`
    <div class="ep"><h4>${esc(t.label)}</h4>
      <audio controls preload="none" src="${t.file}" data-wid="${w.id}" data-idx="${i}"></audio></div>`).join("");
  return `
  <a class="back" href="#/biblioteca">← Volver a la biblioteca</a>
  <section class="detail">
   <span class="eyebrow" style="text-align:left">${esc(catName(w.cat))}</span>
   <h1 class="dh1">${esc(w.title)}</h1>
   <p class="dsub">${esc(a.name||"Autor")}</p>
   <div class="meta-row">
     <span class="meta-pill">Periodo: <b>${esc(w.period)}</b></span>
     <span class="meta-pill">Región: <b>${esc(w.region)}</b></span>
     <span class="meta-pill">Género: <b>${esc(w.genre)}</b></span>
   </div>
   <p class="bodycopy">${esc(w.desc)}</p>
   <div class="sec-label">Escuchar</div>
   ${eps}
   <div class="sec-label">¿Por qué escuchar esto?</div>
   <div class="porque"><p>${esc(w.porque)}</p></div>
